name: Accounting Data Sync & Audit Pipeline

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 00:00) 자동 동기화 & 일일 감사 백업
    - cron: '0 0 * * *'
  workflow_dispatch: # 관리자가 언제든 GitHub Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths:
      - 'scripts/sync_accounting.py'

permissions:
  contents: write

concurrency:
  group: accounting-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Google Sheets Accounting & Create Audit Backup
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔄 Run Accounting Data Pipeline & Masking
        run: |
          python scripts/sync_accounting.py

      - name: 💾 Commit and Push Audit Backup & Latest JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "✔ No accounting data changes detected."
          else
            git commit -m "chore(accounting): auto-sync Google Sheets & archive audit backup [skip ci]"
            git push
            echo "✔ Successfully pushed latest accounting data and backup."
          fi
